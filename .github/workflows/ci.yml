name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  is-push-for-open-pr:
    name: Check for open PR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      is-pr: ${{ steps.check.outputs.is-pr }}
    steps:
      - name: Check open pull requests for branch
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.payload.repository.owner.login}:${branch}`,
              state: 'open',
            });
            core.setOutput('is-pr', pulls.length > 0 ? 'true' : 'false');

  tests:
    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest)' || '' }}
    needs: is-push-for-open-pr
    if: always() && (github.event_name != 'push' || needs.is-push-for-open-pr.outputs.is-pr != 'true')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - typo3: '13.4'
            php: '8.3'
            lowest: false
          - typo3: '13.4'
            php: '8.4'
            lowest: false
          - typo3: '13.4'
            php: '8.5'
            lowest: false
          # Oldest still-supported dependency set, to catch accidental use of
          # APIs that only exist later in the branch.
          - typo3: '13.4'
            php: '8.3'
            lowest: true
          - typo3: '14.3'
            php: '8.3'
            lowest: false
          - typo3: '14.3'
            php: '8.4'
            lowest: false
          - typo3: '14.3'
            php: '8.5'
            lowest: false
          - typo3: '14.3'
            php: '8.3'
            lowest: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            .Build/vendor
            .Build/bin
          key: vendor-${{ runner.os }}-t3${{ matrix.typo3 }}-p${{ matrix.php }}-${{ matrix.lowest }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            vendor-${{ runner.os }}-t3${{ matrix.typo3 }}-p${{ matrix.php }}-${{ matrix.lowest }}-

      - name: Run test matrix
        # Builds the environment and runs both suites in one place, shared with
        # the local composer test:local alias. The script pins the core and
        # drops saschaegerer/phpstan-typo3 (it hard-pins typo3/cms-core and
        # cannot coexist with the matrix legs) in a generated
        # composer-matrix.json, so tracked files stay unmodified, and exports
        # COMPOSER_NO_SECURITY_BLOCKING (every supported core major currently
        # carries an open Packagist advisory; reporting happens in the qa job).
        run: sh Build/Scripts/runTests.sh ${{ matrix.typo3 }} ${{ matrix.lowest && '--lowest' || '' }}

  coverage:
    name: 'Code coverage (TYPO3 13.4 / PHP 8.4)'
    needs: is-push-for-open-pr
    if: always() && (github.event_name != 'push' || needs.is-push-for-open-pr.outputs.is-pr != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            .Build/vendor
            .Build/bin
          key: vendor-${{ runner.os }}-coverage-t313.4-p8.4-${{ hashFiles('composer.json') }}
          restore-keys: |
            vendor-${{ runner.os }}-coverage-

      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: '1'
        run: composer update --with "typo3/cms-core:^13.4" -W --prefer-dist --no-interaction --no-progress

      - name: Run coverage
        # Enforces the per-suite baseline from Build/Quality/coverage-baseline.json
        # and writes clover/cobertura/html reports to .Build/coverage/.
        run: sh Build/Scripts/runCoverage.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .Build/coverage/
          if-no-files-found: warn

  qa-v13:
    name: 'Static analysis & linters (TYPO3 13.4)'
    needs: is-push-for-open-pr
    if: always() && (github.event_name != 'push' || needs.is-push-for-open-pr.outputs.is-pr != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            .Build/vendor
            .Build/bin
          key: vendor-${{ runner.os }}-qa-t313.4-${{ hashFiles('composer.json') }}
          restore-keys: |
            vendor-${{ runner.os }}-qa-t313.4-

      - name: Install dependencies
        # Pinned on purpose: saschaegerer/phpstan-typo3 only ever supports one core
        # major at a time and PHPStan behaviour differs between them, so each major
        # gets its own job. Linting on a fixed core keeps results stable.
        env:
          COMPOSER_NO_SECURITY_BLOCKING: '1'
        run: composer update --with "typo3/cms-core:^13.4" -W --prefer-dist --no-interaction --no-progress

      - name: Install yamllint
        run: python -m pip install --user yamllint

      - name: Lint and analyse
        run: >-
          composer analyze:php
          && composer lint:php
          && composer lint:yaml
          && composer validate:composer

      - name: Report dependency advisories
        # Reported, not enforced: every TYPO3 major in the support window still
        # carries open Packagist advisories, so gating on this would leave the
        # build permanently red and people would stop reading it. Surfaces as a
        # GitHub warning annotation instead.
        run: >-
          composer audit --abandoned=report
          || echo "::warning::composer audit reported findings - see the job log"

  qa-v14:
    name: 'Static analysis & linters (TYPO3 14.3)'
    needs: is-push-for-open-pr
    if: always() && (github.event_name != 'push' || needs.is-push-for-open-pr.outputs.is-pr != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            .Build/vendor
            .Build/bin
          key: vendor-${{ runner.os }}-qa-t314.3-${{ hashFiles('composer.json') }}
          restore-keys: |
            vendor-${{ runner.os }}-qa-t314.3-

      - name: Install dependencies
        # Pinned on purpose: saschaegerer/phpstan-typo3 only ever supports one core
        # major at a time and PHPStan behaviour differs between them, so each major
        # gets its own job. Linting on a fixed core keeps results stable.
        env:
          COMPOSER_NO_SECURITY_BLOCKING: '1'
        run: composer update --with "typo3/cms-core:^14.3" -W --prefer-dist --no-interaction --no-progress

      - name: Install yamllint
        run: python -m pip install --user yamllint

      - name: Lint and analyse
        run: >-
          composer analyze:php
          && composer lint:php
          && composer lint:yaml
          && composer validate:composer

      - name: Report dependency advisories
        # Reported, not enforced: every TYPO3 major in the support window still
        # carries open Packagist advisories, so gating on this would leave the
        # build permanently red and people would stop reading it. Surfaces as a
        # GitHub warning annotation instead.
        run: >-
          composer audit --abandoned=report
          || echo "::warning::composer audit reported findings - see the job log"

  publish-to-ter:
    name: Publish to TER
    # Explicitly check dependency results because the PR check is skipped for tags.
    # This prevents a skipped job in the dependency chain from blocking publishing.
    needs: [tests, qa-v13, qa-v14, coverage]
    if: >-
      ${{
        !cancelled() &&
        needs.tests.result == 'success' &&
        needs['qa-v13'].result == 'success' &&
        needs['qa-v14'].result == 'success' &&
        needs.coverage.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check tag pattern
        run: |
          if ! [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a semver tag, aborting." >&2
            exit 1
          fi

      - name: Get version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, zip, curl
          coverage: none
          tools: composer:v2

      - name: Ensure ext_emconf.php matches tag
        run: |
          emconf="$(php -r '$_EXTKEY="acl_deployment"; include "ext_emconf.php"; echo $EM_CONF["acl_deployment"]["version"];')"
          if [[ "$emconf" != "$version" ]]; then
            echo "ext_emconf.php ($emconf) does not match tag ($version), aborting." >&2
            exit 1
          fi

      - name: Get tag description (TER comment)
        run: |
          comment="$(git tag -l "$version" --format '%(contents)')"
          if [[ -z "${comment// }" ]]; then
            echo "comment=Released version $version" >> "$GITHUB_ENV"
          else
            {
              echo 'comment<<EOF'
              echo "$comment"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: Install tailor
        run: |
          composer global require typo3/tailor --prefer-dist --no-progress --no-suggest
          echo "tailor_bin=$(composer config -g home)/vendor/bin/tailor" >> "$GITHUB_ENV"

      - name: Publish to TER
        run: php "$tailor_bin" ter:publish "$version" --comment "$comment"
