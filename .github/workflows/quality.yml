name: Quality

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Validate composer config
        run: composer validate --no-check-publish

      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: '1'
        run: composer update --no-interaction --no-progress


      - name: Composer security audit
        run: composer audit:composer

      - name: PHP CS check
        run: composer lint:php

      - name: PHPStan
        run: composer analyze:php

      - name: Install yamllint
        run: python -m pip install --user yamllint

      - name: YAML lint
        run: composer lint:yaml

  support-matrix:
    name: 'Dependency check TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lowest: true
            php: '8.3'
            typo3: '13.4'
          - php: '8.5'
            typo3: '14.3'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Check dependency install
        env:
          COMPOSER_NO_SECURITY_BLOCKING: '1'
        run: >-
          composer update
          --with "typo3/cms-core:^${{ matrix.typo3 }}"
          -W
          --prefer-dist
          --no-interaction
          --no-progress
          --no-scripts
          ${{ matrix.lowest && '--prefer-lowest --prefer-stable' || '' }}

  publish-to-ter:
    name: Publish to TER
    needs: [quality, support-matrix]
    if: >-
      ${{
        !cancelled() &&
        needs.quality.result == 'success' &&
        needs.support-matrix.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check tag pattern
        run: |
          if ! [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a semver tag, aborting." >&2
            exit 1
          fi

      - name: Get version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, zip, curl
          coverage: none
          tools: composer:v2

      - name: Ensure ext_emconf.php matches tag
        run: |
          emconf="$(php -r '$_EXTKEY="acl_deployment"; include "ext_emconf.php"; echo $EM_CONF["acl_deployment"]["version"];'")"
          if [[ "$emconf" != "$version" ]]; then
            echo "ext_emconf.php ($emconf) does not match tag ($version), aborting." >&2
            exit 1
          fi

      - name: Get tag description (TER comment)
        run: |
          comment="$(git tag -l "$version" --format '%(contents)')"
          if [[ -z "${comment// }" ]]; then
            echo "comment=Released version $version" >> "$GITHUB_ENV"
          else
            {
              echo 'comment<<EOF'
              echo "$comment"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: Install tailor
        run: |
          composer global require typo3/tailor --prefer-dist --no-progress --no-suggest
          echo "tailor_bin=$(composer config -g home)/vendor/bin/tailor" >> "$GITHUB_ENV"

      - name: Publish to TER
        run: php "$tailor_bin" ter:publish "$version" --comment "$comment"
